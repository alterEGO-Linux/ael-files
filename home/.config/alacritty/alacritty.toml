[general]
live_config_reload = true

[window]
padding = { x = 2, y = 0 }
opacity = 1.00

[font]
size   = 11.0
normal = { family = "Source Code Pro", style = "Medium" }
bold   = { family = "Source Code Pro", style = "Bold" }
italic = { style = "Italic"}

[cursor]
style = { shape = "Beam", blinking = "Off" }

